name: Preparar download limpo
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm run check:local
      - shell: pwsh
        run: ./Preparar-Download.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: APP-CGA-download
          path: dist/APP-CGA-download.zip
